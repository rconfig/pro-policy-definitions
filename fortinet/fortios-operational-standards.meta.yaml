title: "FortiOS operational standards"
description: "Checks drift from your own operational standard, not a hardening baseline: standard NTP, syslog (syslogd and syslogd2) and DNS servers, a pre-login banner, a description on every interface that is not set to status down, a hostname naming pattern and an SNMP location. Replace the example values (RFC 5737 addresses such as 192.0.2.10, and the hostname pattern) with your own before use."
vendor: fortinet
os: fortios
config_format: fortios-full-config
# collection_command: Pro app/Demo/Platforms/FortiOs/FortiOsGenerator.php:53 (primaryCommand)
collection_command: "show full-configuration"
kind: operational
min_rconfig_version: 8.3.0
status: synthetic-tested
framework_claim: null
notes: "The NTP, syslog, DNS and hostname rules use example values, so they fail against real configs until they are edited. They check that the standard servers are present, not that no other servers are configured. The interface rule expects FortiOS's four-space indentation and counts set description, not set alias."
