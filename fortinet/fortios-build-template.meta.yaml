title: "FortiOS build template"
description: "Starting template for a new FortiGate build, not a compliance check: hostname, timezone, admin access, LAN interface, DHCP, DNS, NAT and firewall policies, NTP and logging. Replace the example values (for example set hostname MyFortinet and 192.168.88.0/24) with your own before use."
vendor: fortinet
os: fortios
config_format: fortios-full-config
