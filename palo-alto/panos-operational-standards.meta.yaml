title: "PAN-OS operational standards"
description: "Checks drift from your own operational standard, not a hardening baseline: standard NTP, syslog and DNS servers, a login banner, a comment or link-state down on every ethernet interface, a hostname naming pattern and an SNMP location. Replace the example values (RFC 5737 addresses such as 192.0.2.10, and the hostname pattern) with your own before use."
vendor: palo-alto
os: panos
config_format: panos-brace
# collection_command: Pro app/Demo/Platforms/PanOs/PanOsGenerator.php:66 (primaryCommand)
collection_command: "show config running"
kind: operational
min_rconfig_version: 8.3.0
status: synthetic-tested
framework_claim: null
notes: "Brace format from show config running only; set format is not covered. The NTP, syslog, DNS and hostname rules use example values, so they fail against real configs until they are edited. PAN-OS has two NTP server slots. Tested against synthetic samples only; not checked against output from a real PAN-OS firewall, and settings pushed from Panorama may not appear in show config running."
