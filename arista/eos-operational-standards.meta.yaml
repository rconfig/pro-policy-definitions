title: "Arista EOS operational standards"
description: "Checks drift from your own operational standard, not a hardening baseline: standard NTP, syslog and DNS servers, a login banner, a description on every interface that is not shut down, a hostname naming pattern and an SNMP location. Replace the example values (RFC 5737 addresses such as 192.0.2.10, and the hostname pattern) with your own before use."
vendor: arista
os: eos
config_format: eos-running-config
# collection_command: Pro app/Demo/Platforms/Eos/EosGenerator.php:80 (primaryCommand)
collection_command: "show running-config"
kind: operational
min_rconfig_version: 8.3.0
status: synthetic-tested
framework_claim: null
notes: "The NTP, syslog, DNS and hostname rules use example values, so they fail against real configs until they are edited. They check that the standard servers are present, not that no other servers are configured. Unconfigured Ethernet ports print as a bare interface block and fail the description rule until they are shut down or described. Tested against synthetic show running-config samples only; not checked against output from a real EOS switch."
