title: "IP Infusion OcNOS operational standards"
description: "Checks drift from your own operational standard, not a hardening baseline: standard NTP and syslog servers, a hostname naming pattern and an SNMP location. Replace the example values (RFC 5737 addresses such as 192.0.2.10, and the hostname pattern) with your own before use."
vendor: ip-infusion
os: ocnos
config_format: ocnos-running-config
# collection_command: rConfig-templates ip-infusion/README.md (typical retrieval commands); Pro has no OcNOS demo platform
collection_command: "show running-config"
kind: operational
min_rconfig_version: 8.3.0
status: lab-tested
framework_claim: null
notes: "The NTP, syslog and hostname rules use example values, so they fail against real configs until they are edited. They check that the standard servers are present, not that no other servers are configured. No interface description rule: every port prints an interface block and unused ports are not shut down. Tested against a sanitised show running-config from a real OcNOS-SP 7.0.0 router and a hand-edited copy; the DC edition has not been tested."
