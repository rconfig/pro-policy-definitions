title: "Cisco IOS XR logging"
description: "A remote syslog host, millisecond log timestamps, and console logging disabled or limited to critical and above."
vendor: cisco
os: iosxr
config_format: iosxr-running-config
# collection_command: Pro app/Demo/Platforms/IosXr/IosXrGenerator.php:68 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.0.2
status: synthetic-tested
framework_claim: null
notes: "Tested against synthetic show running-config samples only. The rules have not been checked against output from a real IOS XR device."
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "A remote syslog host is configured by address (logging <address>)"
    references:
      nist_800_53: ["AU-2"]
      hipaa: ["164.312(b)"]
      iso27001: ["A.8.15"]
  - description: "Log timestamps include milliseconds (fails on service timestamps log without datetime msec)"
    references:
      nist_800_53: ["AU-3"]
      hipaa: ["164.312(b)"]
      iso27001: ["A.8.15"]
  - description: "Console logging is disabled or limited to critical and above (logging console disable, critical, alerts or emergencies)"
    references:
      nist_800_53: ["AU-6"]
      hipaa: ["164.312(b)"]
