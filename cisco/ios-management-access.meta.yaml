title: "Cisco IOS management access"
description: "SSH version 2, no Telnet on any line, an exec-timeout of 1 to 10 minutes on the console and every VTY line, and MOTD and login banners."
vendor: cisco
os: ios
config_format: ios-running-config
# collection_command: Pro app/Demo/Platforms/IosXe/IosXeGenerator.php:50 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.3.0
status: lab-tested
framework_claim: null
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "SSH version 2 is enabled (ip ssh version 2)"
    references:
      nist_800_53: ["AC-17"]
      hipaa: ["164.312(a)(1)"]
      iso27001: ["A.8.24"]
  - description: "No transport input line permits Telnet (telnet or all)"
    references:
      nist_800_53: ["AC-17"]
      hipaa: ["164.312(a)(1)"]
      iso27001: ["A.8.5"]
  - description: "No VTY line block sets an exec-timeout outside 1 to 10 minutes (no line means the 10 0 default)"
    references:
      nist_800_53: ["AC-3"]
      iso27001: ["A.8.5"]
  - description: "The console line does not set an exec-timeout outside 1 to 10 minutes (no line means the 10 0 default)"
    references:
      nist_800_53: ["AC-3"]
      iso27001: ["A.8.5"]
  - description: "A MOTD banner is configured (banner motd)"
    references:
      iso27001: ["A.8.5"]
  - description: "A login banner is configured (banner login)"
    references:
      iso27001: ["A.8.5"]
