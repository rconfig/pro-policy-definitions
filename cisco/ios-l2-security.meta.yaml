title: "Cisco IOS interface and L2 security"
description: "Proxy ARP disabled on every interface with an IP address, and every interface shut down or described."
vendor: cisco
os: ios
config_format: ios-running-config
# collection_command: Pro app/Demo/Platforms/IosXe/IosXeGenerator.php:50 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.3.0
status: lab-tested
framework_claim: null
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "Every interface with an IP address has proxy ARP disabled (no ip proxy-arp)"
    references:
      nist_800_53: ["SC-7"]
      iso27001: ["A.8.20"]
  - description: "Every interface is shut down or has a description"
    references:
      nist_800_53: ["SI-4"]
      iso27001: ["A.8.20"]
