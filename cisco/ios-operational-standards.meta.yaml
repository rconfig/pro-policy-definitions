title: "Cisco IOS operational standards"
description: "Checks drift from your own operational standard, not a hardening baseline: standard NTP, syslog and DNS servers, a login banner, a description on every interface that is not shut down, a hostname naming pattern and an SNMP location. Replace the example values (RFC 5737 addresses such as 192.0.2.10, and the hostname pattern) with your own before use."
vendor: cisco
os: ios
config_format: ios-running-config
# collection_command: Pro app/Demo/Platforms/IosXe/IosXeGenerator.php:50 (primaryCommand)
collection_command: "show running-config"
kind: operational
min_rconfig_version: 8.3.0
status: synthetic-tested
framework_claim: null
notes: "The NTP, syslog, DNS and hostname rules use example values, so they fail against real configs until they are edited. They check that the standard servers are present, not that no other servers are configured."
