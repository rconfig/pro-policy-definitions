title: "Cisco NX-OS operational standards"
description: "Checks drift from your own operational standard, not a hardening baseline: standard NTP and syslog servers, a MOTD banner, a hostname naming pattern and an SNMP location. Replace the example values (RFC 5737 addresses such as 192.0.2.10, and the hostname pattern) with your own before use."
vendor: cisco
os: nxos
config_format: nxos-running-config
# collection_command: Pro app/Demo/Platforms/NxOs/NxOsGenerator.php:57 (primaryCommand)
collection_command: "show running-config"
kind: operational
min_rconfig_version: 8.3.0
status: synthetic-tested
framework_claim: null
notes: "The NTP, syslog and hostname rules use example values, so they fail against real configs until they are edited. They check that the standard servers are present, not that no other servers are configured. DNS servers and interface descriptions are not checked (see cisco/README.md). Tested against synthetic show running-config samples only; not checked against output from a real NX-OS switch."
