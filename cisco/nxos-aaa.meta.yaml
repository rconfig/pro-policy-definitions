title: "Cisco NX-OS AAA and local credentials"
description: "Login authentication and accounting through a server group, password strength checking left on, and AES encryption of stored keys."
vendor: cisco
os: nxos
config_format: nxos-running-config
# collection_command: Pro app/Demo/Platforms/NxOs/NxOsGenerator.php:57 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.0.2
status: synthetic-tested
framework_claim: null
notes: "Tested against synthetic show running-config samples only. The rules have not been checked against output from a real NX-OS switch."
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "Login authentication uses a TACACS+ or RADIUS server group (aaa authentication login default group ...)"
    references:
      nist_800_53: ["AC-2"]
      hipaa: ["164.312(a)(1)"]
      nist_csf: ["PR.AC-1"]
      iso27001: ["A.8.5"]
  - description: "AAA accounting sends to a server group (aaa accounting default group ...)"
    references:
      nist_800_53: ["AU-2"]
      hipaa: ["164.312(b)"]
      iso27001: ["A.8.15"]
  - description: "Password strength checking is not disabled (fails on no password strength-check)"
    references:
      nist_800_53: ["IA-5"]
      iso27001: ["A.5.17"]
  - description: "AES password encryption is enabled for stored keys (feature password encryption aes)"
    references:
      nist_800_53: ["CM-6"]
      iso27001: ["A.5.17"]
