title: "Cisco IOS logging"
description: "Remote syslog host, millisecond log timestamps, no console logging, buffered logging and a trap severity level."
vendor: cisco
os: ios
config_format: ios-running-config
# collection_command: Pro app/Demo/Platforms/IosXe/IosXeGenerator.php:50 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.0.2
status: lab-tested
framework_claim: null
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "A remote syslog host is configured (logging host)"
    references:
      nist_800_53: ["AU-2"]
      hipaa: ["164.312(b)"]
      iso27001: ["A.8.15"]
  - description: "Log timestamps use datetime msec, with or without other options (service timestamps log datetime msec ...)"
    references:
      nist_800_53: ["AU-3"]
      hipaa: ["164.312(b)"]
      iso27001: ["A.8.15"]
  - description: "Console logging is off (no logging console line at any level)"
    references:
      nist_800_53: ["AU-6"]
      hipaa: ["164.312(b)"]
  - description: "Buffered logging is configured (logging buffered)"
    references:
      nist_800_53: ["AU-2"]
      iso27001: ["A.8.15"]
  - description: "The logging trap severity level is set (logging trap <level>)"
    references:
      nist_800_53: ["AU-3"]
      iso27001: ["A.8.15"]
