title: "Cisco IOS XR SNMP"
description: "No SNMPv1 or SNMPv2c communities, SNMPv3 users with SHA authentication and AES privacy, and an SNMPv3 authPriv group."
vendor: cisco
os: iosxr
config_format: iosxr-running-config
# collection_command: Pro app/Demo/Platforms/IosXr/IosXrGenerator.php:68 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.3.0
status: synthetic-tested
framework_claim: null
notes: "Tested against synthetic show running-config samples only. The rules have not been checked against output from a real IOS XR device."
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "No SNMPv1 or SNMPv2c community is configured (line snmp-server community is absent)"
    references:
      nist_800_53: ["SC-12"]
      hipaa: ["164.312(e)(1)"]
      iso27001: ["A.8.5"]
  - description: "Every SNMP user is v3 with SHA authentication and AES privacy, and none uses v1, v2c, MD5, DES or 3DES (snmp-server user)"
    references:
      nist_800_53: ["SC-12"]
      hipaa: ["164.312(e)(1)"]
      iso27001: ["A.8.5", "A.8.24"]
  - description: "An SNMPv3 group uses authPriv (snmp-server group ... v3 priv)"
    references:
      nist_800_53: ["SC-12"]
      hipaa: ["164.312(e)(1)"]
      iso27001: ["A.8.5", "A.8.24"]
