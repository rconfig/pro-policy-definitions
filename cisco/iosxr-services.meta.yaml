title: "Cisco IOS XR services"
description: "No TFTP server, IPv4 source routing, directed broadcast, proxy ARP or ICMP redirects."
vendor: cisco
os: iosxr
config_format: iosxr-running-config
# collection_command: Pro app/Demo/Platforms/IosXr/IosXrGenerator.php:68 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.0.2
status: synthetic-tested
framework_claim: null
notes: "Tested against synthetic show running-config samples only. The rules have not been checked against output from a real IOS XR device."
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "The TFTP server is not enabled (fails on tftp ipv4 or ipv6 server)"
    references:
      nist_800_53: ["CM-7"]
      hipaa: ["164.312(c)(1)"]
      iso27001: ["A.8.9"]
  - description: "IPv4 source routing is not enabled (fails on ipv4 source-route)"
    references:
      nist_800_53: ["SC-5"]
      iso27001: ["A.8.20"]
  - description: "Directed broadcast is not enabled on any interface (fails on ipv4 directed-broadcast)"
    references:
      nist_800_53: ["SC-7"]
      iso27001: ["A.8.20"]
  - description: "Proxy ARP is not enabled on any interface (fails on proxy-arp)"
    references:
      nist_800_53: ["SC-7"]
      iso27001: ["A.8.20"]
  - description: "ICMP redirects are not enabled on any interface (fails on ipv4 redirects)"
    references:
      iso27001: ["A.8.20"]
