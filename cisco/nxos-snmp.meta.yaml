title: "Cisco NX-OS SNMP"
description: "No SNMPv1 or SNMPv2c communities, no SNMP user with MD5 authentication, and SNMP message encryption enforced for all users."
vendor: cisco
os: nxos
config_format: nxos-running-config
# collection_command: Pro app/Demo/Platforms/NxOs/NxOsGenerator.php:57 (primaryCommand)
collection_command: "show running-config"
kind: hardening
min_rconfig_version: 8.0.2
status: synthetic-tested
framework_claim: null
notes: "Tested against synthetic show running-config samples only. The rules have not been checked against output from a real NX-OS switch."
# References for each rule, in file order. nist_800_53: NIST SP 800-53 control; hipaa: 45 CFR
# section; nist_csf: NIST CSF 1.1 subcategory; iso27001: ISO/IEC 27001:2022 Annex A control.
# They record controls the rule is relevant to; they do not claim the rule fully meets them.
rules:
  - description: "No SNMPv1 or SNMPv2c community is configured (line snmp-server community is absent)"
    references:
      nist_800_53: ["SC-12"]
      hipaa: ["164.312(e)(1)"]
      iso27001: ["A.8.5"]
  - description: "No SNMP user uses MD5 authentication (fails on snmp-server user ... auth md5)"
    references:
      nist_800_53: ["SC-12"]
      hipaa: ["164.312(e)(1)"]
      iso27001: ["A.8.5", "A.8.24"]
  - description: "SNMP message encryption is enforced for all users (snmp-server globalEnforcePriv)"
    references:
      nist_800_53: ["SC-12"]
      hipaa: ["164.312(e)(1)"]
      iso27001: ["A.8.5", "A.8.24"]
