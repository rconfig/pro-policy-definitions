# Expected results for ip-infusion/ocnos-iso27001.policy, one entry per rule, per sample.
# Generated by .tooling/scripts/verify_with_pro.php --update against rConfig Pro e3b946d347.
# Review every change before committing it.
policy: ip-infusion/ocnos-iso27001.policy
rules:
  -
    rule: 1
    description: 'ISO 27001 A.5.17: Password encryption is enabled (service password-encryption)'
    method: must_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: pass
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 2
    description: 'ISO 27001 A.8.5: Login authentication uses a TACACS+ or RADIUS server group (aaa authentication login default ... group)'
    method: must_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: fail
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 3
    description: 'ISO 27001 A.8.5: A TACACS+ server is configured with a key (tacacs-server login host ... key)'
    method: must_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: fail
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 4
    description: 'ISO 27001 A.8.5: Telnet is not enabled (fails on feature telnet)'
    method: must_not_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: pass
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 5
    description: 'ISO 27001 A.8.5: A custom login banner is configured (banner motd, other than banner motd default)'
    method: must_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: fail
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 6
    description: 'ISO 27001 A.8.5: No SNMPv1 or SNMPv2c community is configured (fails on snmp-server community)'
    method: must_not_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: fail
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 7
    description: 'ISO 27001 A.8.15: A remote syslog server is configured (logging remote server)'
    method: must_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: pass
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 8
    description: 'ISO 27001 A.8.15: Log timestamps are not set to seconds or none (fails on logging timestamp seconds or none)'
    method: must_not_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: pass
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 9
    description: 'ISO 27001 A.8.17: NTP authentication is enabled with a trusted key (ntp authenticate, ntp trusted-key)'
    method: evaluate_block
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: fail
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
  -
    rule: 10
    description: 'ISO 27001 A.8.24: SSH is enabled on the management VRF (feature ssh vrf management)'
    method: must_match_regex
    results:
      ip-infusion/s9510-ocnossp700-unhardened-sanitised-real.txt: pass
      ip-infusion/s9510-ocnossp700-hardened-synthetic.txt: pass
