# Arista sample configs. Addresses, names, AS numbers and secrets are sanitised.
# These are show running-config output, as collected by rConfig's EOS demo platform.
samples:
  - file: dcs7280-eos4322f-hardened-synthetic.txt
    name: Arista DCS-7280CR3-32P4 data centre spine, built to pass the arista/eos-* topic files
    os: eos
    os_version: "4.32.2F"
    config_format: eos-running-config
    source: synthetic
    hardened: true
    origin: "rConfig Pro demo template database/demo/platforms/eos/show-running-config.php (show running-config) at Pro commit e3b946d347, rendered directly with php, read-only: only Pro's Composer autoloader was loaded, the app was not booted and no database was touched. The template variables mirror EosGenerator::initialVars and spineVars for scenario device dub-dc1-sp01 (DCS-7280CR3-32P4, database/demo/scenarios/enterprise.yml) with the default eight leaves and no mutations; the generator's link and port helpers were copied, not called. SeededRandom was not run, so there is no seed; none of its values reach show running-config. Sanitised: example.com in place of the demo domain and SNMP contact; the demo organisation name removed from the banner, SNMP location, a local user name and the SNMP community; point-to-point link addresses moved from 10.0.1.0/27 to 192.0.2.128/27, and spine and leaf loopbacks from 10.0.250.0/24 and 10.0.251.0/24 into 203.0.113.0/24 (59 addresses, including BGP neighbours and the prefix-list); private AS numbers 65000 and 65101 to 65108 changed to documentation AS numbers 64500 and 64501 to 64508; TACACS+ servers moved from 192.0.2.30 and .31 to 192.0.2.32 and .33. Removed the management telnet block with shutdown, which is the default and which EOS does not print. Then edited by hand so that every rule in the arista/eos-* hardening topic files passes and every operational standards example value is met: hostname dub-sw01, idle-timeout 10 under management ssh (the demo has 15), the SNMP community and v2c trap host replaced with an SNMPv3 group NMS v3 priv, a user nms with auth sha and priv aes and a version 3 priv trap host, logging format timestamp high-resolution added, syslog hosts 192.0.2.20 and 192.0.2.21 in place of 192.0.2.50, name servers 192.0.2.30 and 192.0.2.31 in place of 192.0.2.53 and .54, NTP servers 192.0.2.10 and 192.0.2.11 in place of 192.0.2.1 and .2, and shutdown added to the 26 unused Ethernet ports, which the template prints as bare interface blocks. The password hashes, TACACS+ keys, engine ID and localized keys are made up. No device data."
  - file: dcs7280-eos4322f-unhardened-synthetic.txt
    name: Arista DCS-7280CR3-32P4 data centre spine, unhardened
    os: eos
    os_version: "4.32.2F"
    config_format: eos-running-config
    source: synthetic
    hardened: false
    origin: "Built from the same direct render and sanitising as dcs7280-eos4322f-hardened-synthetic.txt (Pro commit e3b946d347, device dub-dc1-sp01, no mutations, no seed), including the removal of the default management telnet block, then renamed dub-dc1-sp02 on 198.51.100.11 and edited by hand so that every rule in the arista/eos-* hardening topic files fails: management telnet with no shutdown added; cipher aes256-cbc aes256-ctr added under management ssh; the login banner removed; protocol http in place of protocol https under management api http-commands; aaa root secret in place of no aaa root; aaa authentication login default local; a user guest with nopassword added; the aaa accounting commands line removed; an SNMPv3 group NMS v3 auth and a user nms with auth md5 and priv des added; the remote syslog host removed. The demo's idle-timeout 15, its v2c SNMP community and the lack of logging format timestamp high-resolution are kept. For the operational standards file: the demo NTP servers 192.0.2.1 and .2 and name servers 192.0.2.53 and .54 kept, no syslog host, no banner, no SNMP location, hostname dub-dc1-sp02 and the 26 unused Ethernet ports left as bare interface blocks. The password hashes, TACACS+ keys, engine ID and localized keys are made up. No device data."
