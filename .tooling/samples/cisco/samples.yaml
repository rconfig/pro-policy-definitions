# Cisco sample configs. Addresses, names, secrets and serials are sanitised.
samples:
  - file: c1921-ios157-lab.txt
    name: Cisco 1921 lab router, unhardened
    os: ios
    os_version: "15.7"
    config_format: ios-running-config
    source: lab
    hardened: false
    origin: rConfig Pro tests/storage/policydata/verbose_show_run.txt at Pro commit ac2d993a2d, sanitised
  - file: c9500-iosxe179-synthetic.txt
    name: Cisco Catalyst 9500 core switch, hardened
    os: ios-xe
    os_version: "17.9"
    config_format: ios-running-config
    source: synthetic
    hardened: true
    origin: rConfig Pro demo generator IosXeGenerator, show running-config, seed seed-a, at Pro commit ac2d993a2d, sanitised
  - file: ios157-operational-standards-synthetic.txt
    name: IOS router built from the operational standards example values
    os: ios
    os_version: "15.7"
    config_format: ios-running-config
    source: synthetic
    hardened: true
    origin: Written by hand in show running-config form from the example values in cisco/ios-operational-standards.policy, with ntp server ... prefer and a one-line ip name-server so the rules are tested against those forms. No device data. Hardened here means it meets the operational standard example values; it is not built to pass every hardening topic file.
  - file: c9500-iosxe179-hardened-synthetic.txt
    name: Cisco Catalyst 9500 core switch, built to pass the hardening topic files
    os: ios-xe
    os_version: "17.9"
    config_format: ios-running-config
    source: synthetic
    hardened: true
    origin: "rConfig Pro demo generator IosXeGenerator, show running-config, device core-sw02 (C9500-24Y4C), seed seed-b, at Pro commit ac2d993a2d, then edited by hand in IOS XE command syntax so that every rule in the cisco/ios-* hardening topic files passes: no service pad, no ip source-route, no ip bootp server, no cdp run, no ip http secure-server, no logging console, service timestamps log datetime msec, exec-timeout 5 0 on the console and VTY lines, a MOTD banner, no SNMP community, no ip proxy-arp on Vlan99, a description on every access port that is not shut down, an OSPF process with area 0 message-digest authentication, and a BGP neighbor with a password (documentation AS numbers 64496 and 64497). Then edited so that every block in cisco/ios-baseline passes with its example values: no service dhcp, ip domain name example.com, ip name-server 192.0.2.53 and 198.51.100.53 on their own lines, ipv6 unicast-routing, a local admin user with a type 9 secret, NTP servers 192.0.2.10 (prefer) and 192.0.2.11, and the SNMPV3GROUP group and its 192.0.2.50 host. The type 7 keys and the type 9 hashes are made up. No device data."
  - file: xr-asr9901-iosxr792-hardened-synthetic.txt
    name: Cisco ASR 9901 IOS XR peering router, built to pass the cisco/iosxr-* topic files
    os: iosxr
    os_version: "7.9.2"
    config_format: iosxr-running-config
    source: synthetic
    hardened: true
    origin: "rConfig Pro demo template database/demo/platforms/ios-xr/show-running-config.php (show running-config) with IosXrGenerator::initialVars for scenario device dub1-pr-asr01 (ASR-9901, database/demo/scenarios/isp.yml) and no mutations, at Pro commit e3b946d347. The template was rendered by a Python port of it, not by running Pro, so there is no seed; the only seeded value that reaches show running-config, the last change time in the header, was set by hand. Sanitised: example.com in place of the demo domain; the demo organisation name removed from the banner, SNMP location and contact; tfn- and TFN- prefixes dropped from user, SNMP user, group, view and prefix-set names; the IXP LAN and IXP peer names replaced with neutral descriptions; loopback, route reflector and core link addresses moved from 10.255.0.0/16 and 100.64.0.0/10 into 198.51.100.0/24 (with the IS-IS NET to match); the BOGONS prefix-set and its references removed, because it lists non-RFC 5737 ranges; AS 64512 changed to documentation AS 64511; TACACS+ servers moved from 192.0.2.30 and .31 (the demo gives them the router's own management address) to 192.0.2.32 and .33. Then edited by hand so that every rule in the cisco/iosxr-* hardening topic files passes and every operational standards example value is met: hostname dub-rtr01, management address 192.0.2.41, exec-timeout 5 0 on line default (the demo has 15 0), syslog hosts 192.0.2.20 and 192.0.2.21 in place of 192.0.2.50, NTP servers 192.0.2.10 and 192.0.2.11 in place of 192.0.2.1 and 192.0.2.2, domain name-server 192.0.2.30 and 192.0.2.31 added. The keys, secrets and hashes are made up. No device data."
  - file: xr-asr9901-iosxr792-unhardened-synthetic.txt
    name: Cisco ASR 9901 IOS XR peering router, unhardened
    os: iosxr
    os_version: "7.9.2"
    config_format: iosxr-running-config
    source: synthetic
    hardened: false
    origin: "Built from the same render and sanitising as xr-asr9901-iosxr792-hardened-synthetic.txt (Pro commit e3b946d347, device dub1-pr-asr01, no mutations, no seed), renamed dub1-pr-asr02 on management address 192.0.2.42, then edited by hand so that every rule in the cisco/iosxr-* hardening topic files fails: ssh server v2 removed; telnet vrf default ipv4 server max-servers 10 added; transport input ssh telnet on line default; exec-timeout 0 0 on line console (line default keeps the demo's 15 0); the MOTD banner removed; aaa authentication login default local; the breakglass user given password 7 in place of its secret; a user operator with a secret 5 (MD5) hash added; snmp-server community public RO added; the SNMP user changed to auth md5 and priv des56; the SNMP group changed from v3 priv to v3 auth; the remote syslog host removed; service timestamps log without msec; logging console informational; tftp ipv4 server homedir disk0: added; ipv4 source-route added; ipv4 directed-broadcast, proxy-arp and ipv4 redirects added on TenGigE0/0/0/2. For the operational standards file: the demo NTP servers 192.0.2.1 and 192.0.2.2 kept, no name servers, no SNMP location, and an in-service interface TenGigE0/0/0/6 with no description added. The keys, secrets and hashes are made up. No device data."
