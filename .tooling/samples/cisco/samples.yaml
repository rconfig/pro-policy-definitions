# Cisco sample configs. Addresses, names, secrets and serials are sanitised.
samples:
  - file: c1921-ios157-lab.txt
    name: Cisco 1921 lab router, unhardened
    os: ios
    os_version: "15.7"
    config_format: ios-running-config
    source: lab
    hardened: false
    origin: rConfig Pro tests/storage/policydata/verbose_show_run.txt at Pro commit ac2d993a2d, sanitised
  - file: c9500-iosxe179-synthetic.txt
    name: Cisco Catalyst 9500 core switch, hardened
    os: ios-xe
    os_version: "17.9"
    config_format: ios-running-config
    source: synthetic
    hardened: true
    origin: rConfig Pro demo generator IosXeGenerator, show running-config, seed seed-a, at Pro commit ac2d993a2d, sanitised
  - file: ios157-operational-standards-synthetic.txt
    name: IOS router built from the operational standards example values
    os: ios
    os_version: "15.7"
    config_format: ios-running-config
    source: synthetic
    hardened: true
    origin: Written by hand in show running-config form from the example values in cisco/ios-operational-standards.policy, with ntp server ... prefer and a one-line ip name-server so the rules are tested against those forms. No device data. Hardened here means it meets the operational standard example values; it is not built to pass every hardening topic file.
  - file: c9500-iosxe179-hardened-synthetic.txt
    name: Cisco Catalyst 9500 core switch, built to pass the hardening topic files
    os: ios-xe
    os_version: "17.9"
    config_format: ios-running-config
    source: synthetic
    hardened: true
    origin: "rConfig Pro demo generator IosXeGenerator, show running-config, device core-sw02 (C9500-24Y4C), seed seed-b, at Pro commit ac2d993a2d, then edited by hand in IOS XE command syntax so that every rule in the cisco/ios-* hardening topic files passes: no service pad, no ip source-route, no ip bootp server, no cdp run, no ip http secure-server, no logging console, service timestamps log datetime msec, exec-timeout 5 0 on the console and VTY lines, a MOTD banner, no SNMP community, no ip proxy-arp on Vlan99, a description on every access port that is not shut down, an OSPF process with area 0 message-digest authentication, and a BGP neighbor with a password (documentation AS numbers 64496 and 64497). Then edited so that every block in cisco/ios-baseline passes with its example values: no service dhcp, ip domain name example.com, ip name-server 192.0.2.53 and 198.51.100.53 on their own lines, ipv6 unicast-routing, a local admin user with a type 9 secret, NTP servers 192.0.2.10 (prefer) and 192.0.2.11, and the SNMPV3GROUP group and its 192.0.2.50 host. The type 7 keys and the type 9 hashes are made up. No device data."
