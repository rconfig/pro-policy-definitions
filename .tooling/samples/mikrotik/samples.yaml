# MikroTik sample configs. Addresses, names and serial numbers are sanitised.
samples:
  - file: ccr2004-routeros7153-synthetic.txt
    name: MikroTik CCR2004 edge router
    os: routeros
    os_version: "7.15.3"
    config_format: routeros-export
    source: synthetic
    hardened: true
    origin: rConfig Pro demo generator RouterOsGenerator, /export, seed seed-a, at Pro commit ac2d993a2d, sanitised
  - file: routeros7153-build-template-synthetic.txt
    name: RouterOS router built from the build template example values
    os: routeros
    os_version: "7.15.3"
    config_format: routeros-export
    source: synthetic
    hardened: true
    origin: Written by hand in /export form from the example values in mikrotik/routeros-build-template.policy, with one wrapped line and one line with its arguments out of order. No device data. The addresses are the template's example values (MikroTik default LAN 192.168.88.0/24, public DNS 8.8.8.8 and 8.8.4.4, public NTP 216.239.35.0 and 216.239.36.0), not RFC 5737 addresses, so that the template rules can pass.
  - file: c52ig-routeros7153-unhardened-synthetic.txt
    name: MikroTik hAP ax2 business CPE, unhardened
    os: routeros
    os_version: "7.15.3"
    config_format: routeros-export
    source: synthetic
    hardened: false
    origin: "rConfig Pro demo generator RouterOsGenerator, /export, profile cpe, device cust-cpe01 (C52iG-5HaxD2HaxD), seed seed-b, at Pro commit ac2d993a2d, sanitised (LAN 192.168.189.0/24 moved to 198.51.100.128/25, operator name, domain and serial number replaced), then edited by hand to undo the hardening: the /ip service and /ip ssh strong-crypto lines removed so services are at their defaults, the SNMP community lines removed so the default community stays enabled, the input drop rule for the WAN removed, the /system identity line removed (factory identity) and remote logging removed. A compact /export does not print values left at their default, so these settings show only as missing lines. No device data."
